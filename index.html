<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just For You 💖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#24112e;--card:#36193f;--rose:#ff6b8b;--gold:#ffc857;--text:#fceff3;--muted:#c9a8d4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
h2,.big,.msg{font-family:'Fraunces',Georgia,serif}
header{text-align:center;padding:32px 16px 4px;position:relative;z-index:2}
.big{font-size:clamp(72px,22vw,140px);font-weight:800;color:var(--gold);line-height:1;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px;position:relative;z-index:2}
nav button{background:var(--card);color:var(--text);border:2px solid transparent;border-radius:999px;padding:10px 16px;font:700 15px 'Nunito',sans-serif;cursor:pointer;transition:transform .2s}
nav button:hover{transform:translateY(-3px)}
nav button[aria-selected="true"]{background:var(--rose);color:#2a0f1c}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:520px;margin:0 auto;padding:0 16px 48px;position:relative;z-index:2}
section{display:none;background:var(--card);border-radius:22px;padding:22px;text-align:center}
section.on{display:block;animation:rise .6s ease-out}
h2{margin:0 0 12px;font-size:26px}
.btn{background:var(--rose);color:#2a0f1c;border:0;border-radius:14px;padding:12px 22px;font:800 16px 'Nunito',sans-serif;cursor:pointer;margin-top:14px;transition:transform .15s}
.btn:active{transform:scale(.94)}
.btn:disabled{opacity:.5}
.msg{font-size:22px;min-height:100px;display:flex;align-items:center;justify-content:center}
.swap{animation:rise .5s ease-out}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.card{aspect-ratio:1;border:0;border-radius:14px;background:#4b2457;font-size:34px;cursor:pointer;color:var(--text);transition:transform .3s,background .3s}
.card.up{background:var(--rose);transform:scale(1.08)}
.card.done{background:var(--gold);animation:pulse .5s}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#4b2457;color:var(--text);border:2px solid transparent;border-radius:14px;padding:12px;font:700 16px 'Nunito',sans-serif;cursor:pointer}
.opt.good{border-color:#7be0a0;background:#1f5a3a}
.opt.bad{border-color:var(--rose);background:#6b1f3a;animation:shake .3s}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin-bottom:8px}
#arena{position:relative;height:300px;background:#2b1435;border-radius:16px;overflow:hidden}
.h{position:absolute;font-size:34px;border:0;background:none;cursor:pointer;padding:0;animation:pop .25s ease-out}
.fl{position:fixed;bottom:-40px;z-index:1;pointer-events:none;opacity:.6;animation:up linear forwards}
footer{text-align:center;color:var(--muted);padding:0 16px 32px;font-size:14px;position:relative;z-index:2}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <p class="sub" id="hello"></p>
  <p class="big" id="days">0</p>
  <p class="sub">days together 💞</p>
</header>

<nav role="tablist" aria-label="Pages">
  <button role="tab" data-t="home" aria-selected="true">Home</button>
  <button role="tab" data-t="messages" aria-selected="false">Messages</button>
  <button role="tab" data-t="memory" aria-selected="false">Memory</button>
  <button role="tab" data-t="quiz" aria-selected="false">Quiz</button>
  <button role="tab" data-t="hearts" aria-selected="false">Hearts</button>
</nav>

<main>
  <section id="home" class="on">
    <h2>Welcome to your corner</h2>
    <p class="msg" id="welcome" style="min-height:0"></p>
    <p class="sub">Pick a page above and have fun while I'm away.</p>
  </section>

  <section id="messages">
    <h2>A note for you</h2>
    <div class="msg" id="msgbox" aria-live="polite">Tap the button 👇</div>
    <button class="btn" id="msgbtn">Another one</button>
  </section>

  <section id="memory">
    <h2>Memory game</h2>
    <div class="stats"><span>Moves: <b id="moves">0</b></span><span id="best"></span></div>
    <div class="grid" id="board"></div>
    <button class="btn" id="mreset">Restart</button>
  </section>

  <section id="quiz">
    <h2>How well do you know me?</h2>
    <div id="qbox"></div>
  </section>

  <section id="hearts">
    <h2>Catch the hearts!</h2>
    <div class="stats"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">20</b>s</span></div>
    <div id="arena"></div>
    <p class="sub" id="hbest"></p>
    <button class="btn" id="hstart">Start</button>
  </section>
</main>

<footer>Made with love by <span id="him"></span> 💖</footer>

<script>
/* ====== EDIT THESE ====== */
const CONFIG = {
  herName: "Babe",
  hisName: "Me",
  startDate: "2024-01-01", // YYYY-MM-DD, the day you got together
  welcome: "I made this just for you.",
  messages: [
    "You're the reason I smile every day.",
    "Even when I'm busy, you're always on my mind.",
    "I'm prouder of you than you'll ever know.",
    "You make my life so much sweeter.",
    "Drink some water, and remember I'm thinking of you. 💧",
    "There's no one like you.",
    "I'm here, even when I'm far away.",
    "You deserve a big kiss and an even bigger hug today."
  ],
  quiz: [
    { q: "Where did we first meet?", a: ["School", "Church", "Online", "At a party"], c: 0 },
    { q: "What's my favorite food?", a: ["Rice and beans", "Griyo", "Patties", "Millet"], c: 1 },
    { q: "What's my favorite color?", a: ["Red", "Blue", "Black", "Green"], c: 1 },
    { q: "What do I do when I have free time?", a: ["Sleep", "Watch movies", "Play games", "Call you"], c: 3 }
  ],
  quizEnd: "You know me so well! 😘"
};
/* ======================== */

const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

$('#hello').textContent = 'Hello, ' + CONFIG.herName;
$('#welcome').textContent = CONFIG.welcome;
$('#him').textContent = CONFIG.hisName;

/* Day counter (counts up on load) */
const total = Math.max(0, Math.floor((Date.now() - new Date(CONFIG.startDate)) / 864e5));
let n = 0;
const step = Math.max(1, Math.ceil(total / 60));
const counter = setInterval(() => {
  n = Math.min(total, n + step);
  $('#days').textContent = n;
  if (n >= total) clearInterval(counter);
}, 25);

/* Floating hearts background */
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
  setInterval(() => {
    const s = document.createElement('span');
    s.className = 'fl';
    s.textContent = ['💖','💗','✨','🌹'][Math.random() * 4 | 0];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (14 + Math.random() * 22) + 'px';
    s.style.animationDuration = (6 + Math.random() * 6) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 12500);
  }, 700);
}

/* Pages */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.t));
}));

/* Messages */
let lastMsg = -1;
$('#msgbtn').addEventListener('click', () => {
  let i;
  do { i = Math.random() * CONFIG.messages.length | 0; } while (i === lastMsg && CONFIG.messages.length > 1);
  lastMsg = i;
  const b = $('#msgbox');
  b.classList.remove('swap'); void b.offsetWidth; b.classList.add('swap');
  b.textContent = CONFIG.messages[i];
});

/* Memory game */
const EMO = ['💖','🌹','🍫','🎁','🌙','⭐','🦋','🍓'];
let open = [], lock = false, moves = 0, found = 0;
const setBest = () => { const b = store.get('memBest'); $('#best').textContent = b ? 'Best: ' + b : ''; };
function flip(c) {
  if (lock || c.classList.contains('up') || c.classList.contains('done')) return;
  c.classList.add('up'); c.textContent = c.dataset.e; open.push(c);
  if (open.length < 2) return;
  moves++; $('#moves').textContent = moves; lock = true;
  const [a, b] = open;
  if (a.dataset.e === b.dataset.e) {
    a.classList.replace('up', 'done'); b.classList.replace('up', 'done');
    open = []; lock = false; found++;
    if (found === EMO.length) {
      const best = +store.get('memBest') || 999;
      if (moves < best) store.set('memBest', moves);
      setBest();
      setTimeout(() => alert('You did it in ' + moves + ' moves! 🎉'), 400);
    }
  } else {
    setTimeout(() => {
      [a, b].forEach(x => { x.classList.remove('up'); x.textContent = ''; });
      open = []; lock = false;
    }, 700);
  }
}
function newGame() {
  const deck = [...EMO, ...EMO].sort(() => Math.random() - .5);
  open = []; lock = false; moves = 0; found = 0; $('#moves').textContent = 0;
  $('#board').innerHTML = '';
  deck.forEach(e => {
    const c = document.createElement('button');
    c.className = 'card'; c.setAttribute('aria-label', 'hidden card'); c.dataset.e = e;
    c.addEventListener('click', () => flip(c));
    $('#board').appendChild(c);
  });
  setBest();
}
$('#mreset').addEventListener('click', newGame);
newGame();

/* Quiz */
let qi = 0, qs = 0;
function showQ() {
  const box = $('#qbox');
  if (qi >= CONFIG.quiz.length) {
    box.innerHTML = '<p class="msg swap">' + qs + ' / ' + CONFIG.quiz.length + '<br>' + CONFIG.quizEnd + '</p>';
    const r = document.createElement('button'); r.className = 'btn'; r.textContent = 'Play again';
    r.onclick = () => { qi = 0; qs = 0; showQ(); };
    box.appendChild(r); return;
  }
  const q = CONFIG.quiz[qi];
  box.innerHTML = '<p class="msg swap" style="min-height:0">' + q.q + '</p><div class="opts"></div>';
  q.a.forEach((t, i) => {
    const o = document.createElement('button'); o.className = 'opt'; o.textContent = t;
    o.onclick = () => {
      box.querySelectorAll('.opt').forEach((x, j) => { x.disabled = true; if (j === q.c) x.classList.add('good'); });
      if (i === q.c) qs++; else o.classList.add('bad');
      setTimeout(() => { qi++; showQ(); }, 900);
    };
    box.querySelector('.opts').appendChild(o);
  });
}
showQ();

/* Catch the hearts */
let score = 0, tl = 20, spawn = null, clock = null;
const showHB = () => { const b = store.get('heartBest'); $('#hbest').textContent = b ? 'Best score: ' + b : ''; };
showHB();
function stopGame() {
  clearInterval(spawn); clearInterval(clock); $('#arena').innerHTML = '';
  const best = +store.get('heartBest') || 0;
  if (score > best) store.set('heartBest', score);
  showHB(); $('#hstart').disabled = false;
  alert("Time's up! You caught " + score + ' hearts 💖');
}
$('#hstart').addEventListener('click', () => {
  score = 0; tl = 20; $('#score').textContent = 0; $('#time').textContent = 20;
  $('#hstart').disabled = true;
  const arena = $('#arena');
  spawn = setInterval(() => {
    const h = document.createElement('button'); h.className = 'h';
    h.textContent = ['💖','💗','💘','💝'][Math.random() * 4 | 0];
    h.setAttribute('aria-label', 'heart');
    h.style.left = Math.random() * (arena.clientWidth - 40) + 'px';
    h.style.top = Math.random() * (arena.clientHeight - 40) + 'px';
    h.onclick = () => { score++; $('#score').textContent = score; h.remove(); };
    arena.appendChild(h);
    setTimeout(() => h.remove(), 1400);
  }, 550);
  clock = setInterval(() => { tl--; $('#time').textContent = tl; if (tl <= 0) stopGame(); }, 1000);
});
</script>
</body>
</html>
